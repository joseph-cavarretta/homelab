# Argo CD helm values — kept intentionally small for a homelab.
# Chart: https://github.com/argoproj/argo-helm/tree/main/charts/argo-cd

configs:
  params:
    # terminate TLS at the ingress / port-forward instead of the argocd server
    server.insecure: true

# single-node control plane: no need for HA replicas
redis-ha:
  enabled: false
controller:
  replicas: 1
server:
  replicas: 1
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.local
    annotations:
      traefik.ingress.kubernetes.io/router.middlewares: argocd-lan-only@kubernetescrd
repoServer:
  replicas: 1
  # default 1s liveness/readiness timeout is too tight for git/gpg/helm
  # work on Raspberry Pi hardware; was causing chronic false-positive
  # liveness failures and restart loops
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
applicationSet:
  replicas: 1
