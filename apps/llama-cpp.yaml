apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llama-cpp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/joseph-cavarretta/homelab
    targetRevision: main
    path: infra/llama-cpp
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
