apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.4.0
    helm:
      valuesObject:
        mode: standalone
        existingSecret: minio-credentials
        persistence:
          size: 50Gi
        resources:
          requests:
            memory: 1Gi
        nodeSelector:
          kubernetes.io/hostname: arch-mini
  destination:
    server: https://kubernetes.default.svc
    namespace: minio
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
