apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik-middleware
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/joseph-cavarretta/homelab
    targetRevision: main
    path: infra/traefik
  destination:
    server: https://kubernetes.default.svc
    namespace: mlflow
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # the llm namespace comes from the llama-cpp app; retry until it exists
    retry:
      limit: 5
      backoff:
        duration: 30s
    syncOptions:
      - CreateNamespace=true
