# Only arch-mini may reach these UIs. Its browser traffic hits the Traefik pod on the
# same node, so kube-proxy masquerades it to arch-mini's pod-bridge address (cni0,
# 10.42.0.1) whatever the Service's externalTrafficPolicy. Other LAN hosts keep their
# real IP under Local, and the other nodes show up as their own pod-network addresses.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: mlflow
spec:
  ipAllowList:
    sourceRange:
      - 192.168.8.130/32
      - 10.42.0.1/32

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: cattle-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.8.130/32
      - 10.42.0.1/32
