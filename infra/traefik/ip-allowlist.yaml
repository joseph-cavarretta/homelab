# Only the control-plane node may reach these UIs. Traefik runs on that node, so
# kube-proxy rewrites its own requests to its pod-bridge IP (cni0, 10.42.0.1).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: mlflow
spec:
  ipAllowList:
    sourceRange:
      - 192.168.8.130/32
      - 10.42.0.1/32

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: lan-only
  namespace: cattle-system
spec:
  ipAllowList:
    sourceRange:
      - 192.168.8.130/32
      - 10.42.0.1/32
