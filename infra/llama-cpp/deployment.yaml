apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
  namespace: llm
  labels:
    app.kubernetes.io/name: llama-cpp
spec:
  replicas: 1
  strategy:
    # Use Recreate: RollingUpdate would spawn a new pod before terminating the old one
    # and 2 x 6 CPU requests exceeds arch-mini's 12 allocatable.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpp
    spec:
      nodeSelector:
        kubernetes.io/hostname: arch-mini
      containers:
      - name: llama-server
        image: ghcr.io/ggml-org/llama.cpp:server-b12316
        imagePullPolicy: IfNotPresent
        args:
          - -hf
          - Qwen/Qwen3-8B-GGUF:Q4_K_M
          - --port
          - "8080"
          - -c
          - "16384"
          - -t
          - "6"
          - -np
          - "1"
          - --reasoning
          - "off"
          - --metrics
        ports:
          - name: http
            containerPort: 8080
        resources:
          requests:
            cpu: "6"
            memory: 10Gi
          limits:
            cpu: "6"
            memory: 10Gi
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        env:
          - name: LLAMA_CACHE
            value: /models
        volumeMounts:
          - name: models
            mountPath: /models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpp-models
