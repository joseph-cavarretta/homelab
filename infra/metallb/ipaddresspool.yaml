# GL.iNet DHCP scope on the homelab LAN is 192.168.8.100-192.168.8.199;
# this range stays clear of that plus the static node bindings.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.8.200-192.168.8.220
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
