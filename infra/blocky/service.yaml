apiVersion: v1
kind: Service
metadata:
  name: blocky
  annotations:
    metallb.io/loadBalancerIPs: 192.168.8.201
spec:
  type: LoadBalancer
  # Keeps real client IPs, and MetalLB only announces from nodes with a ready pod.
  externalTrafficPolicy: Local
  # No NodePorts: they would open DNS on every node and skip the lan-only allowlist.
  allocateLoadBalancerNodePorts: false
  selector:
    app.kubernetes.io/name: blocky
  ports:
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
