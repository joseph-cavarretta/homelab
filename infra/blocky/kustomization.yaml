apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dns
labels:
  - pairs:
      app.kubernetes.io/name: blocky
    includeSelectors: true
resources:
  - deployment.yaml
  - service.yaml
  - pdb.yaml
# The generated ConfigMap name gets a hash of config.yml appended, and the Deployment
# reference is rewritten to match, so editing config.yml rolls the pods.
configMapGenerator:
  - name: blocky-config
    files:
      - config.yml
