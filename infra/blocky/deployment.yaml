apiVersion: apps/v1
kind: Deployment
metadata:
  name: blocky
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: blocky
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blocky
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: blocky
              topologyKey: kubernetes.io/hostname

      containers:
        - name: blocky
          image: ghcr.io/0xerr0r/blocky:v0.36.0
          args:
            - --config
            - /app/config/config.yml
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 4000
              protocol: TCP
          startupProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/app/blocky", "healthcheck"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
          resources:
            # More CPU weight than the default, so a busy node (llama.cpp on
            # arch-mini) can't slow answers enough to push clients to their fallback.
            requests:
              cpu: 200m
              memory: 128Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blocky-config
