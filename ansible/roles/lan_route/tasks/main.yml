---
# The homelab LAN is a plain switch with no DHCP server: every node gets a fixed
# address, and internet traffic goes through arch-mini (roles/gateway).
- name: Set a static address and route internet traffic through the control plane
  community.general.nmcli:
    conn_name: "{{ lan_route_connection }}"
    method4: manual
    ip4: "{{ ansible_host }}/{{ lan_route_prefix }}"
    dns4: "{{ lan_route_dns }}"
    never_default4: true
    routes4:
      - "0.0.0.0/0 {{ lan_route_gateway }}"
    state: present
  notify: reapply lan connection
