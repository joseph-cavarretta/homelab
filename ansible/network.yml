---
# Networking only; safe to run without the rest of site.yml.
- name: Route the homelab LAN through the control plane
  hosts: control_plane
  tags: [gateway]
  roles:
    - gateway

- name: Send LAN hosts' internet traffic via the control plane
  hosts: workers
  tags: [lan_route]
  roles:
    - lan_route

- name: Pin k3s to the homelab LAN
  hosts: control_plane
  tags: [k3s_config]
  tasks:
    - name: Apply k3s server config
      ansible.builtin.include_role:
        name: k3s_server
        tasks_from: config.yml

# After k3s_config: k3s must already read its own resolv.conf before
# /etc/resolv.conf becomes the 127.0.0.53 stub, which pods can't reach.
- name: Send the control plane's DNS through Blocky
  hosts: control_plane
  tags: [local_dns]
  roles:
    - local_dns
